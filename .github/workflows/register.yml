name: Register Package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to register (e.g. 1.0.0, major, minor, patch)'
        required: true
        default: '1.0.0'
      subdir:
        description: 'Subdirectory of the package'
        required: true
        type: choice
        options:
          - 2d/julia
          - 3d/julia

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Register Package
        uses: julia-actions/RegisterAction@v0.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
