name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: '1.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcfitsio-dev zlib1g-dev

    - name: Build tests
      run: make all

    - name: Run tests
      run: make test
